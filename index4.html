<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tugas 3</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 50px;
        }
        .container {
            width: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            background-color: #367588;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: inline-block;
            width: 120px;
            font-weight: bold;
        }
        input[type="number"] {
            width: 200px;
            padding: 5px;
        }
        .buttons {
            margin-left: 125px;
            margin-bottom: 15px;
        }
        button {
            width: 35px;
            height: 30px;
            font-size: 16px;
            cursor: pointer;
            margin-right: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    
    
    <div class="form-group">
        <label for="bil1">Input Bilangan 1</label>
        <input type="number" id="bil1" placeholder="0">
    </div>


    <div class="form-group">
        <label for="bil2">Input Bilangan 2</label>
        <input type="number" id="bil2" placeholder="0">
    </div>


    <div class="buttons">
        <button onclick="hitung('+')">+</button>
        <button onclick="hitung('-')">-</button>
        <button onclick="hitung('*')">x</button>
        <button onclick="hitung('/')">/</button>
    </div>


    <div class="form-group">
        <label for="output">Output</label>
        <input type="text" id="output" readonly>
    </div>
</div>

<script>
    function hitung(operator) {
        let num1 = parseFloat(document.getElementById('bil1').value);
        let num2 = parseFloat(document.getElementById('bil2').value);
        let hasil = 0;

        if (isNaN(num1) || isNaN(num2)) {
            document.getElementById('output').value = "Masukkan kedua bilangan!";
            return;
        }

        switch (operator) {
            case '+':
                hasil = num1 + num2;
                break;
            case '-':
                hasil = num1 - num2;
                break;
            case '*':
                hasil = num1 * num2;
                break;
            case '/':
                if (num2 === 0) {
                    hasil = "Tidak bisa bagi 0";
                } else {
                    hasil = num1 / num2;
                }
                break;
        }

        document.getElementById('output').value = hasil;
    }
</script>

</body>
</html>
